@'
name: Build

on:
  push:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: |
          sudo apt-get update -y --fix-missing
          sudo apt-get install -y libsdl2-dev libgl-dev
      - name: Descargar stb_image.h
        run: curl -L https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -o csrc/stb_image.h
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: openstrike-linux-x64
          path: build/openstrike

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar mingw-w64
        run: |
          sudo apt-get update -y --fix-missing
          sudo apt-get install -y mingw-w64
      - name: Descargar stb_image.h
        run: curl -L https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -o csrc/stb_image.h
      - name: Build
        run: |
          cmake -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win
      - name: Copiar SDL2.dll junto al ejecutable
        run: cp deps/windows/SDL2/x86_64-w64-mingw32/bin/SDL2.dll build-win/
      - uses: actions/upload-artifact@v4
        with:
          name: openstrike-windows-x64
          path: |
            build-win/openstrike.exe
            build-win/SDL2.dll
'@ | Set-Content .github\workflows\build.yml
